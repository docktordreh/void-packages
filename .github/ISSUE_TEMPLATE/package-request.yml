name: Package request
description: Request a new package, update, or fix for the binary repository
title: "[PKG] <package-name> - <new/update/fix> package"
labels: ["package-request"]
assignees: []

body:
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      description: What kind of request is this?
      options:
        - New package
        - Update existing package
        - Fix or rebuild
    validations:
      required: true

  - type: input
    id: package_name
    attributes:
      label: Package name
      description: Exact XBPS package name
      placeholder: example-package
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Target version (if applicable)
      placeholder: 1.2.3
    validations:
      required: false

  - type: input
    id: upstream_url
    attributes:
      label: Upstream URL
      description: Link to upstream project or release page
      placeholder: https://github.com/author/project
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: Additional information
      description: Anything else maintainers should know?
      placeholder: Notes, build flags, special instructions, etc.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have checked that this package/request does not already exist.
          required: true
