name: 🏗️ Build Void Linux Packages

env:
  TAG: workflow-${{ github.run_number }}
  SHA: ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build📦 ${{ matrix.config.arch }}
    runs-on: ${{ matrix.config.runs_on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: aarch64, libc: glibc, runs_on: ubuntu-24.04-arm }
          - { arch: x86_64,  libc: glibc, runs_on: ubuntu-latest }

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20260801R1
      options: --privileged
      env:
        TAG: '${{ env.TAG }}'
        SHA: '${{ env.SHA }}'
        ARCH: '${{ matrix.config.arch }}'
        XBPS_TARGET_ARCH: '${{ matrix.config.arch }}'
        REPO_OWNER: "${{ github.repository_owner }}"
        REPO_NAME: "${{ github.event.repository.name }}"
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      #- name: Cache masterdir
      #  uses: actions/cache@v5
      #  with:
      #    path: void-packages/masterdir-${{ matrix.config.arch }}
      #    key: masterdir-${{ matrix.config.arch }}-${{ hashFiles('void-packages/common/xbps-src/shlibs') }}
      #    restore-keys: |
      #      masterdir-${{ matrix.config.arch }}-

      - name: 🧰 Prep container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq zip unzip git github-cli xtools coreutils
          useradd -G xbuilder -M builder -s $(which bash)

      - name: 🔎 Checkout upstream Void packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      - name: 🧩 Merge package overlay into local build tree
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f $REPO_OWNER https://github.com/$REPO_OWNER/$REPO_NAME.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change $REPO_OWNER/main
          mkdir -p hostdir/binpkgs

          if gh release view --repo "$REPO_OWNER/$REPO_NAME" >/dev/null 2>&1; then
            gh release download --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo "$REPO_OWNER/$REPO_NAME"
          else
            echo "No previous release found; starting with an empty local repository."
          fi

          # Clean up mismatched architectures so repodata generates correctly
          if [ "$ARCH" = "x86_64" ]; then
            rm --force hostdir/binpkgs/*x86_64-musl*
          elif [ "$ARCH" = "x86_64-musl" ]; then
            rm --force hostdir/binpkgs/*x86_64.xbps
          fi
          rm --force hostdir/binpkgs/*.xbps.sig2

      - name: 📋 Identify changes to build
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo "$REPO_OWNER/$REPO_NAME" || echo "Initial Commit")
          latest_sha=$(git rev-list --max-count=1 "$latest_name" 2>/dev/null || git rev-list --max-parents=0 "$REPO_OWNER/main")
          echo "Latest Tag Name: ${latest_name}"
          echo "Latest Tag SHA: ${latest_sha}"

          chown -R builder:builder .
          git diff-tree -r --no-renames --name-only --diff-filter=AM "$latest_sha" "$SHA" -- 'srcpkgs/**' \
          | cut -d/ -f 2 | sort -u | xargs -r sudo -Eu builder ./xbps-src sort-dependencies | tee /tmp/templates

      - name: 🛠️ Setup void-packages
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf
          echo 'XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"' >> etc/conf

      - name: 🔧 Prepare masterdir
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          sudo -Eu builder ./xbps-src -m masterdir-${{ matrix.config.arch }} -A ${{ matrix.config.arch }} binary-bootstrap

      # -------------------- Packages to build --------------------

      - name: 🗑️ Reset package cache & sync repos
        working-directory: void-packages
        run: |
          sudo -Eu builder ./xbps-src clean

      - name: 📦 build pkgs
        working-directory: void-packages
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            echo "🏗️ Building $pkg for $ARCH..."
            sudo -Eu builder ./xbps-src pkg -j "$(nproc)" \
              -m "masterdir-${{ matrix.config.arch }}" \
              -A "${{ matrix.config.arch }}" "$pkg"
          done < /tmp/templates

      # -----------------------------------------------------------

      - name: 🧾 Clean & sign
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
        run: |
          set -eu

          printf '%s\n' "${PRIVKEY}" > key.pem
          chown builder:builder key.pem
          chmod 600 key.pem

          set -- *.xbps

          if [ ! -e "$1" ]; then
            echo "❌ No XBPS packages found"
            ls -la
            exit 1
          fi

          echo "📦 Packages:"
          printf '  %s\n' "$@"

          # Ensure packages are registered and repodata exists.
          sudo -Eu builder xbps-rindex --add "$@"

          echo "📚 Repository data:"
          ls -l *-repodata

          # Now these operations have an existing repository index.
          sudo -Eu builder xbps-rindex --remove-obsoletes "${PWD}"

          sudo -Eu builder xbps-rindex \
            --privkey key.pem \
            --sign \
            --signedby "${REPO_NAME}-github-actions" \
            --verbose \
            "${PWD}"

          sudo -Eu builder xbps-rindex \
            --privkey key.pem \
            --sign-pkg \
            --verbose \
            "$@"

          sudo -Eu builder xbps-rindex --clean "${PWD}"

          rm -f key.pem

      - name: 🔢 checksum
        working-directory: void-packages/hostdir/binpkgs
        run: |
          set -euo pipefail
          rm -f -- *.sha256sum *.sha512sum
          shopt -s nullglob
          packages=(*.xbps)

          if ((${#packages[@]} == 0)); then
            echo "❌ No packages found to checksum."
            exit 1
          fi

          for file in "${packages[@]}"; do
            sha256sum "${file}" | cut -d ' ' -f 1 > "${file}.sha256sum"
            sha512sum "${file}" | cut -d ' ' -f 1 > "${file}.sha512sum"
          done

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: void-packages/hostdir/binpkgs

      - name: 🏷️ short sha
        run: |
          printf 'SHORT_SHA=%s\n' "${SHA:0:7}" >> "$GITHUB_ENV"

      - name: 🚀 release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.SHORT_SHA }}
          tag_name: ${{ env.TAG }}
          files: |
            void-packages/hostdir/binpkgs/*.xbps
            void-packages/hostdir/binpkgs/*.sig2
            void-packages/hostdir/binpkgs/*repodata
